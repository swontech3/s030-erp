/* ── 미확정 상수 ── */
/** 만기 임박 기준일. 운영에서 보는 기준이 바뀌면 이 값만 교체한다. */

const ROOMS_TOTAL = 20;
const ROOMS_OCCUPIED = 12;
/** 만기 임박 기준일. D-day 배지의 warning 임계값과 같은 값을 쓴다. */
const SOON_DAYS = 30;

const OPEN_HOUR = 9;
const SLOTS = 26;
const NOW_SLOT = 8 + 40 / 30; // 13:40

const TOKEN_FALLBACK = {
  "--surface": "#FFFFFF", "--surface-alt": "#F8FAFC", "--border": "#E2E8F0",
  "--text-heading": "#0B1120", "--text-body": "#475569", "--text-muted": "#64748B",
  "--text-caption": "#94A3B8", "--color-primary": "#4F46E5",
  "--color-primary-hover": "#4338CA", "--color-accent-bg": "#EEF2FF",
  "--color-warning": "#D97706", "--color-warning-bg": "#FEF3C7",
  "--color-warning-text": "#92400E", "--color-danger": "#DC2626",
  "--color-danger-bg": "#FEE2E2",
};

/** 인디고 3톤 + 시안. 종료 계약을 danger 색으로 칠하지 않는다. */
const C_NEW = "#818CF8";
const C_END = "#C7D2FE";
const C_LINE = "#4F46E5";

const EXPIRY = [
  { org: "오르카 스튜디오", room: "2층 고정석 7", term: "2025.09.01 – 2026.08.31", end: "08.31", d: 4 },
  { org: "브릿지랩 주식회사", room: "3층 Room-1", term: "2026.01.15 – 2026.09.14", end: "09.14", d: 18 },
  { org: "한결세무법인", room: "비상주", term: "2026.03.01 – 2026.09.30", end: "09.30", d: 34 },
  { org: "노틸러스", room: "3층 A-12", term: "2025.11.01 – 2026.10.31", end: "10.31", d: 65 },

];

const MONTHS = [

class Component extends DCLogic {
  state = { range: 6, ready: [], failed: [] };

  get cards() { return ["stats", "expiry", "rooms", "chart"]; }

  componentDidMount() {
    this.bindAll();
    this.load();
  }

  componentDidUpdate() {
    this.bindAll();
    this.paint();
  }

  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }

  /** 카드별 스켈레톤 — 전체 화면 스피너를 쓰지 않고 준비된 카드부터 표시한다. */
  load() {
    this.timers = [];
    this.setState({ ready: [], failed: this.props.cardError ? ["expiry"] : [] });
    this.cards.forEach((key, i) => {
      this.timers.push(setTimeout(() => {
        this.setState({ ready: this.state.ready.concat([key]) });
      }, 220 + i * 160));
    });
  }

  token(name) {
    if (!this.tk) this.tk = {};
    if (this.tk[name]) return this.tk[name];
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    if (v) { this.tk[name] = v; return v; }
    return TOKEN_FALLBACK[name] || "";
  }

  once(el, key) {
    if (!el || el.getAttribute("data-bound-" + key)) return false;
    el.setAttribute("data-bound-" + key, "1");
    return true;
  }

  label(slot) {
    const h = OPEN_HOUR + Math.floor(slot / 2);
    return String(h).padStart(2, "0") + ":" + (slot % 2 ? "30" : "00");
  }

  duration(len) {
    const h = Math.floor(len / 2), m = (len % 2) * 30;
    return (h ? h + "시간" : "") + (h && m ? " " : "") + (m ? m + "분" : "");
  }

  bindAll() {
    const reload = document.querySelector("[data-d-reload]");
    if (this.once(reload, "reload")) reload.addEventListener("click", () => this.load());
    const retry = document.querySelector("[data-retry]");
    if (this.once(retry, "retry")) {
      retry.addEventListener("click", () => {
        this.setState({ failed: [], ready: this.state.ready.concat(["expiry"]) });
      });
    }
    document.querySelectorAll("[data-seg]").forEach((seg) => {
      seg.querySelectorAll("[data-seg-btn]").forEach((b) => {
        if (!this.once(b, "seg")) return;
        b.addEventListener("click", () => this.setState({ range: Number(b.getAttribute("data-seg-btn")) }));
      });
    });
  }

  paint() {
    const ready = this.state.ready;
    const failed = this.state.failed;
    document.querySelectorAll("[data-card]").forEach((card, i) => {
      const key = card.getAttribute("data-card");
      const ok = ready.indexOf(key) > -1;
      const bad = failed.indexOf(key) > -1;
      const skel = card.querySelector("[data-skel]");
      const body = card.querySelector("[data-body]");
      const err = card.querySelector("[data-err]");
      if (skel) skel.style.display = ok ? "none" : "flex";
      if (err) err.style.display = ok && bad ? "flex" : "none";
      // 카드가 선언한 display로 복원한다. 여기서 flex를 하드코딩하면
      // flex-direction 없는 본문이 row가 되어 레이아웃이 옆으로 눕는다.
      if (body) body.style.display = ok && !bad ? (body.getAttribute("data-body-display") || "block") : "none";
      if (ok && !card.getAttribute("data-shown")) {
        card.setAttribute("data-shown", "1");
        card.style.animation = "fUp 240ms var(--ease-out) " + (i * 80) + "ms both";
      }
    });

    const seg = document.querySelector('[data-seg="range"]');
    if (seg) {
      seg.querySelectorAll("[data-seg-btn]").forEach((b) => {
        const on = Number(b.getAttribute("data-seg-btn")) === this.state.range;
        b.style.background = on ? this.token("--surface") : "transparent";
        b.style.color = on ? this.token("--text-heading") : this.token("--text-muted");
        b.style.fontWeight = on ? "700" : "400";
        b.style.boxShadow = on ? "0 1px 2px rgba(11,17,32,.06)" : "none";
      });
    }

    // 요약 지표는 전부 파생값이다 — 하드코딩하면 같은 화면의 다른 숫자와 어긋난다.
    const occ = document.querySelector("[data-d-occ]");
    const occSub = document.querySelector("[data-d-occ-sub]");
    if (occ) occ.textContent = Math.round(ROOMS_OCCUPIED / ROOMS_TOTAL * 100) + "%";
    if (occSub) occSub.textContent = ROOMS_TOTAL + "실 중 " + ROOMS_OCCUPIED + "실 · 회의실 제외";
    const soon = document.querySelector("[data-d-soon]");
    if (soon) {
      // 캡션·배지·카드 목록이 한 기준을 쓴다.
      const n = EXPIRY.filter((r) => r.d <= SOON_DAYS).length;
      soon.textContent = "만기 임박 " + n + "건";
      soon.style.color = this.token(n ? "--color-warning-text" : "--text-muted");
    }

    const synced = document.querySelector("[data-d-synced]");
    if (synced) synced.textContent = new Date().toTimeString().slice(0, 5) + " 조회";
    const icon = document.querySelector("[data-d-reload-icon]");
    if (icon) icon.style.animation = ready.length < this.cards.length ? "spin 800ms linear infinite" : "none";

    if (ready.indexOf("expiry") > -1 && failed.indexOf("expiry") < 0) this.paintExpiry();
    if (ready.indexOf("rooms") > -1) this.paintRooms();
    if (ready.indexOf("chart") > -1) this.paintChart();
  }

  /** 만기일 오름차순, 90일 이내 최대 6건. 놓치면 매출이 빠지는 블록이다. */
  paintExpiry() {
    const host = document.querySelector("[data-d-expiry]");
    if (!host) return;
    const rows = EXPIRY.filter((r) => r.d <= EXPIRY_WINDOW_DAYS).sort((a, b) => a.d - b.d).slice(0, 6);
    host.textContent = "";
    if (!rows.length) {
      host.appendChild(this.empty("calendar-check", EXPIRY_WINDOW_DAYS + "일 이내 만기 예정 계약이 없습니다"));
      return;
    }
    const border = this.token("--border");
    rows.forEach((r, i) => {
      const row = document.createElement("button");
      row.style.cssText = "width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0;border:0;" +
        (i === rows.length - 1 ? "" : "border-bottom:1px solid " + border + ";") +
        "background:transparent;font-family:inherit;text-align:left;cursor:pointer;transition:background var(--dur) var(--ease-out)";
      row.addEventListener("mouseenter", () => { row.style.background = this.token("--surface-alt"); });
      row.addEventListener("mouseleave", () => { row.style.background = "transparent"; });

      const left = document.createElement("div");
      left.style.cssText = "min-width:0;padding-left:4px";
      const org = document.createElement("div");
      org.textContent = r.org;
      org.style.cssText = "font-size:15px;font-weight:600;color:" + this.token("--text-heading") +
        ";white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
      const sub = document.createElement("div");
      sub.textContent = r.room + " · " + r.term;
      sub.style.cssText = "margin-top:3px;font-size:13px;color:" + this.token("--text-muted") +
        ";white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
      left.appendChild(org);
      left.appendChild(sub);
      row.appendChild(left);

      const right = document.createElement("div");
      right.style.cssText = "flex:0 0 auto;display:flex;align-items:center;gap:10px;padding-right:4px";
      const badge = document.createElement("span");
      badge.textContent = "D-" + r.d;
      // 7일 이내는 danger, 30일 이내는 warning, 그 외는 뉴트럴.
      const tone = r.d <= 7 ? ["--color-danger-bg", "--color-danger"]
        : r.d <= SOON_DAYS ? ["--color-warning-bg", "--color-warning-text"]
        : ["--surface-alt", "--text-muted"];
      badge.style.cssText = "height:24px;padding:0 10px;display:inline-flex;align-items:center;border-radius:999px;background:" +
        this.token(tone[0]) + ";color:" + this.token(tone[1]) +
        ";font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums";
      const end = document.createElement("span");
      end.textContent = r.end;
      end.style.cssText = "font-size:13px;color:" + this.token("--text-muted") + ";font-variant-numeric:tabular-nums";
      right.appendChild(badge);
      right.appendChild(end);
      row.appendChild(right);
      host.appendChild(row);
    });
  }

  /** 현황판 타임라인 규칙 그대로 — 막대 안에 텍스트를 넣지 않는다. */
  paintRooms() {
    const tl = document.querySelector("[data-d-timeline]");
    const list = document.querySelector("[data-d-today]");
    const sum = document.querySelector("[data-d-today-sum]");
    if (!tl || !list || !sum) return;
    const pct = (n) => (n / SLOTS) * 100;

    tl.textContent = "";
    TODAY_BOOKINGS.forEach((b) => {
      const bar = document.createElement("span");
      bar.style.cssText = "position:absolute;top:0;bottom:0;left:" + pct(b.slot) + "%;width:" + pct(b.len) +
        "%;border-radius:6px;background:#818CF8";
      tl.appendChild(bar);
    });
    const line = document.createElement("span");
    line.style.cssText = "position:absolute;top:0;bottom:0;left:" + pct(NOW_SLOT) + "%;width:2px;background:#22D3EE;z-index:2";
    tl.appendChild(line);

    list.textContent = "";
    const rows = TODAY_BOOKINGS.slice(0, 4);
    if (!rows.length) {
      list.appendChild(this.empty("calendar-check", "오늘 예약이 없습니다"));
      sum.textContent = "";
      return;
    }
    const border = this.token("--border");
    rows.forEach((b, i) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 0;" +
        (i === rows.length - 1 ? "" : "border-bottom:1px solid " + border);
      const time = document.createElement("span");
      time.textContent = this.label(b.slot) + "–" + this.label(b.slot + b.len);
      time.style.cssText = "flex:0 0 auto;font-size:14px;font-weight:600;color:" + this.token("--text-heading") +
        ";font-variant-numeric:tabular-nums";
      const org = document.createElement("span");
      org.textContent = b.org;
      org.style.cssText = "flex:1;min-width:0;font-size:13px;color:" + this.token("--text-muted") +
        ";white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
      row.appendChild(time);
      row.appendChild(org);
      if (b.pending) {
        const dot = document.createElement("span");
        dot.title = "승인 대기";
        dot.style.cssText = "flex:0 0 auto;width:8px;height:8px;border-radius:999px;background:" + this.token("--color-warning");
        row.appendChild(dot);
      }
      list.appendChild(row);
    });
    const slots = TODAY_BOOKINGS.reduce((n, b) => n + b.len, 0);
    sum.textContent = "오늘 " + TODAY_BOOKINGS.length + "건 · 총 " + this.duration(slots);
  }

  /**
   * 세로 막대(신규·종료) + 꺾은선(진행 누계) 복합 차트. 외부 라이브러리 없이
   * SVG로 직접 그린다 — DS에 차트 컴포넌트가 없어 이 파일이 첫 정의가 된다.
   * 금액 축은 넣지 않는다(3차 범위).
   */
  paintChart() {
    const host = document.querySelector("[data-d-chart]");
    const sumHost = document.querySelector("[data-d-chart-sum]");
    if (!host || !sumHost) return;
    const data = MONTHS.slice(-this.state.range);
    const W = 1148, H = 260, PAD_L = 44, PAD_R = 48, PAD_T = 12, PAD_B = 28;
    const plotW = W - PAD_L - PAD_R;
    const plotH = H - PAD_T - PAD_B;
    const border = this.token("--border");
    const caption = this.token("--text-caption");

    // 좌축은 건수 최대, 우축은 누계 최대. 둘을 따로 정규화한다.
    const maxBar = Math.max(4, ...data.map((d) => Math.max(d.nw, d.end)));
    // 누계는 당월(ACTIVE_CONTRACTS)에서 뒤에서 앞으로 역산한다. 고정 시드를 쓰면
    // 6개월 슬라이스에서 앞 기간의 순증이 빠져 같은 달이 다른 값을 낸다.
    const cum = [];
    let back = ACTIVE_CONTRACTS;
    for (let i = data.length - 1; i >= 0; i--) {
      cum[i] = back;
      back -= data[i].nw - data[i].end;
    }
    const maxCum = Math.max(...cum) * 1.15;

    const x = (i) => PAD_L + (plotW / data.length) * (i + 0.5);
    const yBar = (v) => PAD_T + plotH - (v / maxBar) * plotH;
    const yLine = (v) => PAD_T + plotH - (v / maxCum) * plotH;

    const svgNS = "http://www.w3.org/2000/svg";
    const el = (tag, attrs) => {
      const n = document.createElementNS(svgNS, tag);
      Object.keys(attrs).forEach((k) => n.setAttribute(k, attrs[k]));
      return n;
    };

    host.textContent = "";
    const svg = el("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: String(H), style: "display:block;overflow:visible" });

    // 가로 격자만 — 세로 격자는 두지 않는다.
    for (let t = 0; t <= 4; t++) {
      const v = Math.round((maxBar / 4) * t);
      const y = yBar(v);
      svg.appendChild(el("line", { x1: PAD_L, y1: y, x2: W - PAD_R, y2: y, stroke: border, "stroke-width": "1" }));
      const lab = el("text", { x: PAD_L - 10, y: y + 4, "text-anchor": "end", fill: caption, "font-size": "11" });
      lab.textContent = String(v);
      svg.appendChild(lab);
      const rlab = el("text", { x: W - PAD_R + 10, y: y + 4, fill: caption, "font-size": "11" });
      rlab.textContent = String(Math.round((maxCum / 4) * t));
      svg.appendChild(rlab);
    }

    const band = plotW / data.length;
    const bw = Math.min(20, band * 0.28);
    data.forEach((d, i) => {
      const cx = x(i);
      [[d.nw, C_NEW, -1], [d.end, C_END, 1]].forEach(([v, color, side]) => {
        if (!v) return;
        const h = plotH - (yBar(v) - PAD_T);
        svg.appendChild(el("rect", {
          x: cx + (side < 0 ? -bw - 2 : 2), y: yBar(v), width: bw, height: Math.max(2, h),
          rx: "3", fill: color,
        }));
      });
      const mlab = el("text", { x: cx, y: H - 8, "text-anchor": "middle", fill: caption, "font-size": "11" });
      mlab.textContent = d.m;
      svg.appendChild(mlab);

      // 호버 툴팁 — 해당 월의 신규/종료/누계 3줄.
      const hit = el("rect", { x: cx - band / 2, y: PAD_T, width: band, height: plotH, fill: "transparent" });
      hit.style.cursor = "default";
      const tipText = d.m + "\n신규 " + d.nw + "건\n종료 " + d.end + "건\n진행 누계 " + cum[i] + "건";
      const title = el("title", {});
      title.textContent = tipText;
      hit.appendChild(title);
      svg.appendChild(hit);
    });

    const path = cum.map((v, i) => (i ? "L" : "M") + x(i) + " " + yLine(v)).join(" ");
    svg.appendChild(el("path", { d: path, fill: "none", stroke: C_LINE, "stroke-width": "2" }));
    cum.forEach((v, i) => {
      svg.appendChild(el("circle", { cx: x(i), cy: yLine(v), r: "4", fill: C_LINE }));
    });

    host.appendChild(svg);

    const totalNew = data.reduce((n, d) => n + d.nw, 0);
    const totalEnd = data.reduce((n, d) => n + d.end, 0);
    sumHost.textContent = "";
    [
      ["최근 " + this.state.range + "개월 신규", totalNew + "건"],
      ["종료", totalEnd + "건"],
      ["순증", (totalNew - totalEnd >= 0 ? "+" : "") + (totalNew - totalEnd) + "건"],
    ].forEach(([k, v], i) => {
      const cell = document.createElement("div");
      cell.style.cssText = "padding:0 20px;" + (i ? "border-left:1px solid " + border : "");
      const label = document.createElement("div");
      label.textContent = k;
      label.style.cssText = "font-size:13px;color:" + this.token("--text-muted");
      const val = document.createElement("div");
      val.textContent = v;
      val.style.cssText = "margin-top:4px;font-size:20px;font-weight:700;color:" +
        this.token(i === 2 ? "--color-primary" : "--text-heading") + ";font-variant-numeric:tabular-nums";
      cell.appendChild(label);
      cell.appendChild(val);
      sumHost.appendChild(cell);
    });
  }

  empty(icon, text) {
    const box = document.createElement("div");
    box.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 0";
    const glyph = document.createElement("span");
    glyph.style.cssText = "width:32px;height:32px;display:block;background:" + this.token("--text-caption") +
      ";-webkit-mask-image:url('https://unpkg.com/lucide-static@0.414.0/icons/" + icon +
      ".svg');mask-image:url('https://unpkg.com/lucide-static@0.414.0/icons/" + icon +
      ".svg');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat";
    const label = document.createElement("span");
    label.textContent = text;
    label.style.cssText = "font-size:14px;color:" + this.token("--text-muted");
    box.appendChild(glyph);
    box.appendChild(label);
    return box;
  }
}

</script>
</body>
</html>
