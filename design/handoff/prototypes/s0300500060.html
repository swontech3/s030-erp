<style>

.k-qr .a{font-size:20px;font-weight:700;color:var(--text-heading);white-space:nowrap;text-align:center;line-height:1.3}

<script>
/* ══════════════════════════════════════════════════════════════
   상수 — 06-kiosk.md
   ══════════════════════════════════════════════════════════════ */
const QR_BASE = "https://erp.swonbiz.com/booking";   // → s0300600010 ?room={id}&src=kiosk
const POLL_MS = 30000;          // 데이터 30초
const TICK_MS = 1000;           // 시계·마커 1초 (로컬)
const STALE_MIN = 30;           // 이 이상 끊기면 현황을 보여주지 않음
const ROW_MAX_SLOTS = 18;       // 한 행 최대 9시간
const SLOT = 30;

/* ══════════════════════════════════════════════════════════════
   시안 데이터 — s0300600010 시안과 같은 날(9/30) 같은 예약
   현황판 응답에는 시간만 들어옵니다 (제목·조직 없음)
   ══════════════════════════════════════════════════════════════ */
const ROOMS = {
  A: { name: "회의실 A", open: 540, close: 1320, nextOpenLabel: "내일 09:00" },
  B: { name: "회의실 B", open: 480, close: 1200, nextOpenLabel: "내일 08:00" },
  C: { name: "미팅룸 C", open: 540, close: 1080, nextOpenLabel: "내일 09:00" },
};
const TODAY = {
  A: [{ s: 660, e: 780 }, { s: 780, e: 840 }, { s: 960, e: 1020 }, { s: 1020, e: 1080 }, { s: 1200, e: 1260 }],
  B: [{ s: 600, e: 720 }],
  C: [{ s: 810, e: 840 }],
};

const state = { room: "A", now: 820, net: "online", data: "has" };

const $ = (s) => document.querySelector(s);
const fmt = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const room = () => ROOMS[state.room];
const list = () => (state.data === "empty" ? [] : TODAY[state.room]);
const offlineMin = () => (state.net === "off5" ? 5 : state.net === "off40" ? 40 : 0);

/* ══════════════════════════════════════════════════════════════
   렌더
   ══════════════════════════════════════════════════════════════ */
function paint() {
  const r = room(), now = state.now;
  $("#k-room").textContent = r.name;
  $("#k-clock").textContent = fmt(now);
  $("#c-qr").textContent = QR_BASE + "?room=" + state.room + "&src=kiosk";

  const off = offlineMin();
  const stale = off >= STALE_MIN;
  $("#k-offline").classList.toggle("is-on", off > 0);
  $("#k-offline-at").textContent = "마지막 갱신 " + fmt(now - off);
  $("#k-body").classList.toggle("is-stale", stale);

  const outside = now < r.open || now >= r.close;
  $("#k-dim").classList.toggle("is-on", outside);

  paintBanner(r, now, stale);
  paintRows(r, now);
  paintCards(now, r);
}

/** 한 줄 상태 — 원거리에서 배경색만으로 판단되게 */
function paintBanner(r, now, stale) {
  const b = $("#k-banner"), main = $("#k-main"), sub = $("#k-sub");
  const L = list();
  const liveB = L.find((x) => now >= x.s && now < x.e);
  const next = L.filter((x) => x.s > now).sort((a, z) => a.s - z.s)[0];
  b.classList.remove("is-live");

  if (stale) { main.textContent = "현황을 확인할 수 없습니다"; sub.textContent = "연결되면 자동으로 갱신됩니다"; return; }
  if (now < r.open) {
    main.textContent = "운영 시작 전";
    sub.textContent = fmt(r.open) + "부터" + (next ? " · 첫 예약 " + fmt(next.s) : "");
    return;
  }
  if (now >= r.close) { main.textContent = "운영 종료"; sub.textContent = r.nextOpenLabel + "부터"; return; }
  if (liveB) {
    b.classList.add("is-live");
    main.textContent = "사용 중 · " + fmt(liveB.e) + "까지";
    /* 바로 이어지는 예약이 있으면 비는 시각이 아니라 연속 사용임을 알린다 */
    const cont = L.find((x) => x.s === liveB.e);
    sub.textContent = cont ? "이어서 예약 " + fmt(cont.s) + "–" + fmt(cont.e) : next ? "다음 예약 " + fmt(next.s) : "이후 예약 없음";
    return;
  }
  main.textContent = next ? "비어 있음 · " + fmt(next.s) + "까지" : "비어 있음";
  sub.textContent = next ? "다음 예약 " + fmt(next.s) + "–" + fmt(next.e) : "오늘 남은 예약 없음";
}

/**
 * 타임라인 행 — 운영시간을 18슬롯(9시간) 단위로 나눕니다.
 * 모든 행의 슬롯 폭이 같도록 짧은 행은 폭을 비율로 줄입니다.
 */
function paintRows(r, now) {
  const host = $("#k-rows");
  host.innerHTML = "";
  const total = (r.close - r.open) / SLOT;
  const rows = [];
  for (let from = 0; from < total; from += ROW_MAX_SLOTS) rows.push([from, Math.min(from + ROW_MAX_SLOTS, total)]);
  const unit = Math.min(ROW_MAX_SLOTS, total);

  rows.forEach(([a, z]) => {
    const span = z - a;
    const t0 = r.open + a * SLOT, t1 = r.open + z * SLOT;
    const pct = (slots) => (slots / span) * 100;
    const row = document.createElement("div");
    row.className = "k-row";
    row.innerHTML = '<div class="lab">' + fmt(t0).slice(0, 2) + "–" + fmt(t1).slice(0, 2) + '</div><div class="tl" style="width:' + (span / unit * 100) + '%;flex:0 0 auto;max-width:calc(100% - 72px)"><div class="k-ticks"></div><div class="k-track"></div></div>';
    const ticks = row.querySelector(".k-ticks"), track = row.querySelector(".k-track");
    row.querySelector(".tl").style.width = "calc((100% - 72px) * " + (span / unit) + ")";

    for (let i = 1; i < span; i++) {
      const g = document.createElement("span");
      g.className = "g" + ((t0 + i * SLOT) % 60 ? " half" : "");
      g.style.left = pct(i) + "%";
      track.appendChild(g);
    }
    list().forEach((b) => {
      const s = Math.max(b.s, t0), e = Math.min(b.e, t1);
      if (e <= s) return;
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.left = pct((s - t0) / SLOT) + "%";
      bar.style.width = pct((e - s) / SLOT) + "%";
      track.appendChild(bar);
    });
    for (let m = Math.ceil(t0 / 60) * 60; m <= t1; m += 60) {
      const x = pct((m - t0) / SLOT);
      const t = document.createElement("span");
      t.textContent = String(m / 60).padStart(2, "0");
      t.style.left = x + "%";
      t.style.transform = m === t0 ? "none" : m === t1 ? "translateX(-100%)" : "translateX(-50%)";
      t.style.opacity = m < now ? ".3" : "1";
      ticks.appendChild(t);
    }
    if (now >= t0 && now < t1) {
      const x = pct((now - t0) / SLOT);
      const line = document.createElement("div");
      line.className = "now";
      line.style.left = x + "%";
      track.appendChild(line);
      const tri = document.createElement("span");
      tri.className = "k-tri";
      tri.style.left = x + "%";
      ticks.appendChild(tri);
    }
    host.appendChild(row);
  });
}

/** 다음 예약 3장 — 진행 중인 예약은 배너가 말하므로 빼고, 시작 전인 것만 */
function paintCards(now, r) {
  const host = $("#k-cards");
  const up = list().filter((b) => b.s > now).sort((a, z) => a.s - z.s).slice(0, 3);
  host.innerHTML = "";
  if (!up.length) {
    host.innerHTML = '<div class="k-empty">' + (now >= r.close ? "오늘 예약이 모두 끝났습니다" : "오늘 남은 예약이 없습니다") + "</div>";
    return;
  }
  up.forEach((b) => {
    const c = document.createElement("div");
    c.className = "k-card";
    c.innerHTML = '<div class="t">' + fmt(b.s) + " – " + fmt(b.e) + '</div><div class="s">예약됨</div>';
    host.appendChild(c);
  });
}

/** QR — 시안은 결정적 패턴. 실제는 QR_BASE?room=…&src=kiosk 로 생성 */
function paintQr() {
  const host = $("#k-qr");
  for (let i = 0; i < 441; i++) {
    const rr = Math.floor(i / 21), c = i % 21;
    const finder = (rr < 7 && c < 7) || (rr < 7 && c > 13) || (rr > 13 && c < 7);
    const ring = finder && (rr % 6 === 0 || c % 6 === 0 || (rr % 14 > 1 && rr % 14 < 5 && c % 14 > 1 && c % 14 < 5));
    const on = finder ? ring : (rr * 7 + c * 13 + (rr % 3) * (c % 5)) % 3 === 0;
    const s = document.createElement("span");
    if (on) s.style.background = "#0B1120";
    host.appendChild(s);
  }
}

/** 우하단 3회 탭 → 개발 정보 5초 */
let taps = 0, tapReset, devTimer;
$("#k-hit").addEventListener("click", () => {
  taps++; clearTimeout(tapReset); tapReset = setTimeout(() => { taps = 0; }, 600);
  if (taps < 3) return;
  taps = 0;
  const d = $("#k-dev");
  d.innerHTML = "1280 × 800<br>room " + state.room + " · 갱신 " + fmt(state.now - offlineMin());
  d.classList.add("is-on");
  clearTimeout(devTimer); devTimer = setTimeout(() => d.classList.remove("is-on"), 5000);
});

/* 데이터 갱신 연출 — 페이드만, 레이아웃 이동 없음 */
function fade() { const s = $("#k-screen"); s.classList.remove("is-fade"); void s.offsetWidth; s.classList.add("is-fade"); }

/* 확인 컨트롤 바 */
[["#c-room", "room"], ["#c-time", "now", Number], ["#c-net", "net"], ["#c-data", "data"]].forEach(([sel, k, cast]) =>
  $(sel).addEventListener("change", (e) => { state[k] = cast ? cast(e.target.value) : e.target.value; paint(); fade(); }));

function fit() {
  const st = $("#stage"), dv = $("#device");
  const s = Math.min((st.clientWidth - 40) / 1280, (st.clientHeight - 40) / 800, 1);
  dv.style.transform = "scale(" + s + ")";
  dv.style.margin = (-(800 * (1 - s)) / 2) + "px " + (-(1280 * (1 - s)) / 2) + "px";
}
window.addEventListener("resize", fit);

paintQr();
paint();
fit();
lucide.createIcons();
</script>
