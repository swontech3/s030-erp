<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:16px}.lbl{font-size:12px;color:var(--text-caption);letter-spacing:.06em;text-transform:uppercase;font-weight:700}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, Icon } = window.SwonBizDesignSystem_9f2a02;
function Demo(){const [c,setC]=React.useState(true);const [p,setP]=React.useState("1");const [s,setS]=React.useState(true);
return <div className="stack">
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
  <Input label="회사명" placeholder="스원비즈 주식회사"/>
  <Select label="지점" options={["강남 3호점","판교 1호점","성수 2호점"]}/>
  <Input label="이메일" defaultValue="hello@swonbiz" error="이미 가입된 이메일입니다"/>
  <Input label="검색" size="sm" placeholder="계약서, 증빙 검색" iconLeft={<Icon name="search" size={16}/>} style={{alignSelf:"end"}}/>
</div>
<div className="row" style={{gap:24}}>
  <Checkbox label="이용약관 동의" checked={c} onChange={e=>setC(e.target.checked)}/>
  <Radio name="p" label="1인실" checked={p==="1"} onChange={()=>setP("1")}/>
  <Radio name="p" label="4인실" checked={p==="4"} onChange={()=>setP("4")}/>
  <Switch label="세금계산서 자동 발행" checked={s} onChange={e=>setS(e.target.checked)}/>
</div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
