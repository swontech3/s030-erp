<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S05 세무 서비스 — SwonBiz 시안 (1단계)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script src="https://unpkg.com/lucide@0.414.0/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="tax.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     확인 컨트롤 바 — ★ 개발 확인용. 실서비스 화면에는 포함되지 않습니다
     ══════════════════════════════════════════════════════════════ -->
<div class="devbar">
  <strong>확인용</strong>
  <label>화면
    <select id="c-screen">
      <option value="home">S05-01 이번 달 할 일</option>
      <option value="upload">S05-02 자료 올리기</option>
      <option value="match">S05-04 은행 짝 맞추기</option>
      <option value="classify">S05-05 거래 분류</option>
      <option value="vendors">S05-06 거래처</option>
      <option value="wh">S05-07 원천세</option>
      <option value="pl">S05-08 월별 손익</option>
      <option value="vat">S05-09 부가세</option>
      <option value="send">S05-10 세무사 전달</option>
      <option value="settings">S05-11 세무 설정</option>
      <option value="emp">S05-12 직원 급여</option>
    </select>
  </label>
  <label>사업자 유형
    <select id="c-type"><option value="corp">법인</option><option value="indiv">개인 일반과세자</option></select>
  </label>
  <label><input type="checkbox" id="c-half">원천세 반기납부</label>
  <button type="button" id="c-reset">처음 상태로</button>
  <span class="sp"></span>
  <span style="opacity:.6">시안 오늘 = 2026.10.06 · 작업할 달 기본 = 2026년 9월</span>
</div>

<div class="stage">
  <div class="frame">
    <aside class="bb-menu" aria-hidden="true"><b>삐용 메뉴</b><span>이 자리는 그리지 않습니다</span><span>248px</span></aside>
    <div class="bb-main">
      <div class="bb-top"><span class="t" id="bb-title">세무</span><span class="tag" id="bb-code"></span></div>
      <main class="body" id="body"></main>
    </div>
  </div>
</div>
<div class="toast" id="toast"><i data-lucide="check" style="width:16px;height:16px"></i><span></span></div>

<script src="tax-data.js"></script>
<script src="tax-app.js"></script>
<script src="tax-screens-a.js"></script>
<script src="tax-screens-b.js"></script>
<script src="tax-screens-c.js"></script>
<script src="tax-screens-d.js"></script>
<script>
document.getElementById("c-screen").addEventListener("change", (e) => go(e.target.value));
document.getElementById("c-type").addEventListener("change", (e) => { S.type = e.target.value; S.ui.draft = null; render(); });
document.getElementById("c-half").addEventListener("change", (e) => { S.settings.halfYear = e.target.checked; S.ui.draft = null; render(); });
document.getElementById("c-reset").addEventListener("click", () => { S = freshState(); render(); });
render();
</script>
</body>
</html>
